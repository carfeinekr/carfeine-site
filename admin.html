<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>예약 관리 | Car Feine</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#faf9f6;--surface:#ffffff;--ink:#1c1c1f;--steel:#55555c;
    --line:#e6e4df;--red:#c8202f;--red-deep:#9e1522;--red-tint:#fdeceb;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;line-height:1.6;padding:24px 5%;}
  h1{font-size:22px;font-weight:600;margin-bottom:4px;}
  .sub{color:var(--steel);font-size:14px;margin-bottom:28px;}
  input,select,textarea,button{font-family:inherit;font-size:14px;}
  input,select,textarea{
    padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;
  }
  label{display:block;font-size:12.5px;color:var(--steel);margin-bottom:5px;font-weight:500;}
  .field{margin-bottom:14px;}
  button{cursor:pointer;border-radius:8px;border:none;transition:opacity .15s ease;}
  button:hover{opacity:.85;}
  .btn-primary{background:linear-gradient(135deg,var(--red) 0%,var(--red-deep) 100%);color:#fff;padding:11px 20px;font-weight:500;}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:9px 16px;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:6px;}

  /* LOGIN */
  #loginView{max-width:340px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px;}
  #loginView h1{text-align:center;margin-bottom:24px;}
  #loginError{color:var(--red-deep);font-size:13px;margin-top:8px;display:none;}

  /* DASHBOARD */
  #dashboardView{display:none;max-width:900px;margin:0 auto;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .toolbar .left{display:flex;align-items:center;gap:10px;}
  .toolbar input[type="date"]{width:auto;}
  .day-nav{display:flex;gap:4px;}
  .day-nav button{width:32px;height:32px;background:var(--surface);border:1px solid var(--line);border-radius:8px;}

  .booking-list{display:flex;flex-direction:column;gap:10px;}
  .booking-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;
    display:flex;gap:16px;align-items:flex-start;
  }
  .booking-card.status-완료{opacity:.55;}
  .booking-card.status-취소{opacity:.4;text-decoration:line-through;}
  .booking-time{
    font-weight:600;font-size:14px;color:var(--red-deep);min-width:110px;flex-shrink:0;
  }
  .booking-main{flex:1;min-width:0;}
  .booking-main .name-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}
  .booking-main .name{font-weight:600;font-size:15px;}
  .booking-main .tag{
    font-size:11px;background:var(--red-tint);color:var(--red-deep);padding:2px 9px;border-radius:20px;font-weight:500;
  }
  .booking-main .meta{color:var(--steel);font-size:13px;}
  .booking-main .memo{color:var(--steel);font-size:12.5px;margin-top:4px;font-style:italic;}
  .booking-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .empty-state{color:var(--steel);text-align:center;padding:48px 0;font-size:14px;}
  .conflict-warning{
    background:#fff4e5;border:1px solid #f0c98a;color:#8a5a00;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;
  }

  /* MODAL */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--surface);border-radius:14px;padding:28px;max-width:420px;width:100%;
    max-height:90vh;overflow-y:auto;
  }
  .modal-panel h2{font-size:18px;margin-bottom:18px;}
  .modal-row{display:flex;gap:10px;}
  .modal-row .field{flex:1;}
  .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .logout-link{color:var(--steel);font-size:13px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

<div id="loginView">
  <h1>예약 관리 로그인</h1>
  <div class="field">
    <label>이메일</label>
    <input type="email" id="loginEmail" autocomplete="username">
  </div>
  <div class="field">
    <label>비밀번호</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
  </div>
  <button class="btn-primary" style="width:100%;" id="loginBtn">로그인</button>
  <div id="loginError">이메일 또는 비밀번호가 올바르지 않습니다.</div>
</div>

<div id="dashboardView">
  <div class="toolbar">
    <div class="left">
      <h1 style="margin:0;">예약 시간표</h1>
    </div>
    <span class="logout-link" id="logoutBtn">로그아웃</span>
  </div>
  <div class="toolbar">
    <div class="left">
      <div class="day-nav">
        <button id="prevDayBtn">‹</button>
        <button id="todayBtn" class="btn-sm btn-ghost" style="width:auto;">오늘</button>
        <button id="nextDayBtn">›</button>
      </div>
      <input type="date" id="dateInput">
    </div>
    <button class="btn-primary" id="addBookingBtn">+ 새 예약</button>
  </div>

  <div id="conflictWarning" class="conflict-warning" style="display:none;"></div>
  <div class="booking-list" id="bookingList"></div>
</div>

<div class="modal-overlay" id="bookingModal">
  <div class="modal-panel">
    <h2 id="modalTitle">새 예약 추가</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>고객명</label>
      <input type="text" id="fCustomerName">
    </div>
    <div class="modal-row">
      <div class="field">
        <label>연락처</label>
        <input type="text" id="fPhone" placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label>차종</label>
        <input type="text" id="fCarModel" placeholder="예: 아반떼">
      </div>
    </div>
    <div class="field">
      <label>서비스</label>
      <select id="fServiceType">
        <option value="기본세차">기본세차</option>
        <option value="디테일링">디테일링</option>
        <option value="광택(2스텝)">광택(2스텝)</option>
        <option value="광택(3스텝)">광택(3스텝)</option>
        <option value="유리막코팅">유리막코팅</option>
        <option value="크리스탈실드">크리스탈실드</option>
        <option value="얼티메이트">얼티메이트</option>
      </select>
    </div>
    <div class="modal-row">
      <div class="field">
        <label>시작 시간</label>
        <input type="datetime-local" id="fStartTime">
      </div>
      <div class="field">
        <label>소요시간(분)</label>
        <input type="number" id="fDuration" step="10">
      </div>
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="fMemo" rows="2"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="modalCancelBtn">취소</button>
      <button class="btn-primary" id="modalSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://gzquszbwjiukkubzcjgx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_p_qYXindfKgZMwaNo5q0QA_prT0t3U2';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const SERVICE_DURATIONS = {
    '기본세차':60,'디테일링':240,'광택(2스텝)':480,'광택(3스텝)':600,
    '유리막코팅':240,'크리스탈실드':600,'얼티메이트':720,
  };

  const loginView = document.getElementById('loginView');
  const dashboardView = document.getElementById('dashboardView');
  const dateInput = document.getElementById('dateInput');
  const bookingList = document.getElementById('bookingList');
  const modal = document.getElementById('bookingModal');
  const conflictWarning = document.getElementById('conflictWarning');

  let currentBookings = [];

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  dateInput.value = todayStr();

  function fmtTime(iso){
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function addMinutes(iso, mins){
    return new Date(new Date(iso).getTime() + mins*60000);
  }

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if (data.session) {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      loadBookings();
    } else {
      loginView.style.display = 'block';
      dashboardView.style.display = 'none';
    }
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      document.getElementById('loginError').style.display = 'block';
    } else {
      checkSession();
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    checkSession();
  });

  document.getElementById('prevDayBtn').addEventListener('click', () => shiftDate(-1));
  document.getElementById('nextDayBtn').addEventListener('click', () => shiftDate(1));
  document.getElementById('todayBtn').addEventListener('click', () => { dateInput.value = todayStr(); loadBookings(); });
  dateInput.addEventListener('change', loadBookings);

  function shiftDate(delta){
    const d = new Date(dateInput.value + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    dateInput.value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    loadBookings();
  }

  async function loadBookings(){
    const day = dateInput.value;
    const start = day + 'T00:00:00+09:00';
    const end = day + 'T23:59:59+09:00';
    const { data, error } = await sb
      .from('bookings')
      .select('*')
      .gte('start_time', start)
      .lte('start_time', end)
      .order('start_time', { ascending: true });
    if (error) {
      bookingList.innerHTML = '<div class="empty-state">불러오기 실패: ' + error.message + '</div>';
      return;
    }
    currentBookings = data || [];
    renderBookings();
  }

  function renderBookings(){
    if (currentBookings.length === 0) {
      bookingList.innerHTML = '<div class="empty-state">이 날짜엔 예약이 없어요.</div>';
      return;
    }
    bookingList.innerHTML = currentBookings.map(b => {
      const endTime = addMinutes(b.start_time, b.duration_minutes);
      return `
        <div class="booking-card status-${b.status}">
          <div class="booking-time">${fmtTime(b.start_time)} - ${fmtTime(endTime)}</div>
          <div class="booking-main">
            <div class="name-row">
              <span class="name">${escapeHtml(b.customer_name)}</span>
              <span class="tag">${escapeHtml(b.service_type)}</span>
              <span class="tag" style="background:var(--line);color:var(--steel);">${escapeHtml(b.status)}</span>
            </div>
            <div class="meta">${escapeHtml(b.car_model || '')} ${b.phone ? '· ' + escapeHtml(b.phone) : ''}</div>
            ${b.memo ? `<div class="memo">${escapeHtml(b.memo)}</div>` : ''}
          </div>
          <div class="booking-actions">
            ${b.status === '예약확정' ? `<button class="btn-sm btn-ghost" onclick="setStatus(${b.id},'완료')">완료</button>` : ''}
            ${b.status === '예약확정' ? `<button class="btn-sm btn-ghost" onclick="setStatus(${b.id},'취소')">취소</button>` : ''}
            <button class="btn-sm btn-ghost" onclick="openEdit(${b.id})">수정</button>
            <button class="btn-sm btn-ghost" onclick="deleteBooking(${b.id})">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  window.setStatus = async function(id, status){
    await sb.from('bookings').update({ status }).eq('id', id);
    loadBookings();
  };
  window.deleteBooking = async function(id){
    if (!confirm('이 예약을 삭제할까요?')) return;
    await sb.from('bookings').delete().eq('id', id);
    loadBookings();
  };
  window.openEdit = function(id){
    const b = currentBookings.find(x => x.id === id);
    if (!b) return;
    openModal(b);
  };

  document.getElementById('addBookingBtn').addEventListener('click', () => openModal(null));
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);

  document.getElementById('fServiceType').addEventListener('change', (e) => {
    document.getElementById('fDuration').value = SERVICE_DURATIONS[e.target.value] || 60;
  });

  function toLocalInputValue(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function openModal(booking){
    document.getElementById('modalTitle').textContent = booking ? '예약 수정' : '새 예약 추가';
    document.getElementById('editId').value = booking ? booking.id : '';
    document.getElementById('fCustomerName').value = booking ? booking.customer_name : '';
    document.getElementById('fPhone').value = booking ? (booking.phone || '') : '';
    document.getElementById('fCarModel').value = booking ? (booking.car_model || '') : '';
    document.getElementById('fServiceType').value = booking ? booking.service_type : '기본세차';
    document.getElementById('fDuration').value = booking ? booking.duration_minutes : SERVICE_DURATIONS['기본세차'];
    document.getElementById('fMemo').value = booking ? (booking.memo || '') : '';
    if (booking) {
      document.getElementById('fStartTime').value = toLocalInputValue(booking.start_time);
    } else {
      const d = new Date(dateInput.value + 'T09:00:00');
      document.getElementById('fStartTime').value = toLocalInputValue(d);
    }
    conflictWarning.style.display = 'none';
    modal.classList.add('open');
  }
  function closeModal(){ modal.classList.remove('open'); }

  document.getElementById('modalSaveBtn').addEventListener('click', async () => {
    const id = document.getElementById('editId').value;
    const startTimeLocal = document.getElementById('fStartTime').value;
    const duration = parseInt(document.getElementById('fDuration').value, 10) || 60;
    const payload = {
      customer_name: document.getElementById('fCustomerName').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      car_model: document.getElementById('fCarModel').value.trim(),
      service_type: document.getElementById('fServiceType').value,
      start_time: new Date(startTimeLocal).toISOString(),
      duration_minutes: duration,
      memo: document.getElementById('fMemo').value.trim(),
    };
    if (!payload.customer_name) { alert('고객명을 입력해주세요.'); return; }

    // overlap check against same-day bookings (excluding itself)
    const newStart = new Date(payload.start_time).getTime();
    const newEnd = newStart + duration*60000;
    const overlap = currentBookings.find(b => {
      if (String(b.id) === String(id)) return false;
      if (b.status === '취소') return false;
      const bStart = new Date(b.start_time).getTime();
      const bEnd = bStart + b.duration_minutes*60000;
      return newStart < bEnd && bStart < newEnd;
    });
    if (overlap && !confirm(`⚠ ${overlap.customer_name}님 예약(${fmtTime(overlap.start_time)})과 시간이 겹쳐요. 그래도 저장할까요?`)) {
      return;
    }

    if (id) {
      await sb.from('bookings').update(payload).eq('id', id);
    } else {
      await sb.from('bookings').insert(payload);
    }
    closeModal();
    // if saved date differs from currently viewed date, jump to it
    const savedDate = startTimeLocal.slice(0,10);
    if (savedDate !== dateInput.value) dateInput.value = savedDate;
    loadBookings();
  });

  checkSession();
</script>

</body>
</html>
